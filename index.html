<style>

  /* ========== 云同步 ========== */
  .cloud-fab{position:fixed;bottom:24px;right:24px;z-index:50;width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(102,126,234,.4);transition:transform .2s,box-shadow .2s;animation:cloudFab 3s ease-in-out infinite}

<body>
<header>
  <h1>📋 帝君老师·暑假奖惩打卡</h1>
  <div class="datebar">
    <button id="prev">‹</button>
    <span class="cur" id="curDate"></span>
    <button id="next">›</button>
  </div>
</header>
<div class="tabs">
  <button data-tab="reward" class="active">🎁 奖励打卡</button>

</div>

  <div id="tab-reward"></div>
  <div id="tab-plan" class="hidden"></div>
  <div id="tab-punish" class="hidden"></div>
  <div id="tab-stat" class="hidden"></div>

</div>




<div id="drawModal" class="modal hidden">
  <div class="modal-card">
    <div id="drawSpin" class="spin">🎰</div>
    <div id="drawResult" class="result hidden"></div>
    <button id="drawClose" class="draw-close hidden">收下奖品 🎁</button>
  </div>
</div>

<script>


const STORE = 'dijun_checkin_v1';
const TIERS = [
  {key:'longzhu', label:'龙珠', prob:0.06},
  {key:'a', label:'0.1-0.4元', prob:0.20},
  {key:'b', label:'0.5-0.9元', prob:0.15},
  {key:'c', label:'1-1.5元', prob:0.10},
  {key:'d', label:'2元', prob:0.08},
  {key:'e', label:'2.5元', prob:0.07},
  {key:'f', label:'3元', prob:0.07},
];
const DEFAULT_PRIZES = [
  {name:'龙珠1颗'},
  {name:'0.1元红包', price:0.1},{name:'0.2元红包', price:0.2},{name:'0.3元红包', price:0.3},{name:'0.4元红包', price:0.4},
  {name:'0.5元红包', price:0.5},{name:'0.6元红包', price:0.6},{name:'0.7元红包', price:0.7},{name:'0.8元红包', price:0.8},{name:'0.9元红包', price:0.9},
  {name:'1元红包', price:1},{name:'1.2元红包', price:1.2},{name:'1.5元红包', price:1.5},
  {name:'2元红包', price:2},{name:'2.5元红包', price:2.5},{name:'3元红包', price:3},
];
const ENCOURAGE = ['再接再厉,明天会更好!','就差一点点,下次一定中!','坚持就是胜利,加油!','今天的运气在攒着呢~','勇于尝试的你最棒!','小遗憾,也是大成长!','好运正在路上,别急~','你已经很努力啦!','下一份惊喜在等你!','保持微笑,幸运会来!','过程比结果更珍贵哦','稳住,我们能赢!'];
let lastEncourage='';
function renderSavings(){
  const el = document.getElementById('tab-savings');
  const s = state.savings || {total:0, history:[], milestone:0};
  const goal = 1000;
  const milestoneCount = Math.floor(s.total / goal);
  const pct = Math.min(100, Math.round((s.total % goal) / goal * 100));
  const currentMilestone = milestoneCount * goal;
  const nextMilestone = (milestoneCount + 1) * goal;
  const remaining = nextMilestone - s.total;
  let h = '<div class="savings-card">';
  h += '<div style="font-size:13px;opacity:0.85">当前储蓄金</div>';
  h += '<div class="savings-amount">'+s.total.toFixed(1)+'<span>元</span></div>';
  h += '<div class="savings-progress"><div class="savings-progress-bar" style="width:'+pct+'%">'+(pct>=10?pct+'%':' ')+'</div></div>';
  h += '<div class="savings-goal">距下一阶段 '+nextMilestone+' 元还差 '+remaining.toFixed(1)+' 元</div>';
  if(remaining <= 0){
    h += '<div class="savings-milestone"><strong>🎉 储蓄金已达标！</strong><br>家长存入 +50元 奖励即可达成下一阶段！</div>';
  }
  h += '</div>';
  h += '<div class="savings-msg" style="text-align:center;color:#888;font-size:13px;margin-bottom:16px">来源：每次抽奖奖金的50%自动存入 | 每满1000元家长奖励+50元</div>';
  h += '<div class="savings-record">';
  h += '<div class="savings-record-title">📋 储蓄记录（最近30条）</div>';
  if(!s.history || !s.history.length){
    h += '<div class="savings-empty">暂无记录，完成抽奖后自动积累</div>';
  } else {
    s.history.slice(0, 30).forEach(function(r){
      const cls = r.type === 'lottery' ? 'deposit' : (r.type === 'reward' ? 'reward' : 'withdraw');
      const sign = r.type === 'withdraw' ? '-' : '+';
      const reason = r.type === 'lottery' ? (r.prize ? r.prize+'奖励' : '抽奖') : r.reason;
      h += '<div class="savings-record-item '+cls+'">';
      h += '<div><div>'+sign+r.amount.toFixed(1)+'元</div><div class="srec-reason">'+reason+' · '+r.date+'</div></div>';
      h += '<div style="font-size:12px;color:#999">'+r.date+'</div>';
      h += '</div>';
    });
  }
  h += '</div>';
  el.innerHTML = h;
}

// openSavingsDeposit 已停用（手动存取功能已移除）
function openSavingsDeposit(){ alert('此功能已停用。储蓄金全部来自抽奖奖金自动积累。'); }

// openSavingsWithdraw 已停用（手动存取功能已移除）
function openSavingsWithdraw(){ alert('此功能已停用。储蓄金全部来自抽奖奖金自动积累。'); }

// openSavingsReset 已停用（手动存取功能已移除）
function openSavingsReset(){ alert('此功能已停用。储蓄金全部来自抽奖奖金自动积累。'); }

function checkSavingsMilestone(){
  const s = state.savings;
  if(!s) return;
  // Check if crossed a 1000-milestone boundary not yet acknowledged
  const currentMilestone = Math.floor(s.total / 1000);
  if(currentMilestone > (s.milestone || 0)){
    s.milestone = currentMilestone;
    save();
    setTimeout(function(){
      const confirmed = confirm('🎉 储蓄金已达到 '+currentMilestone+'000 元！\n\n是否存入家长奖励 +50元？\n\n（点"确定"奖励立即到账）');
      if(confirmed){
        s.total += 50;
        s.history.unshift({type:'reward', amount:50, reason:'家长存入（储蓄达标'+currentMilestone+'000元奖励）', date:today()});
        save();
        alert('+50元 已存入储蓄金！');
        if(state.currentView === 'savings') renderSavings();
      }
    }, 500);
  }
}

// claimSavingsReward 已停用（手动存取功能已移除）
function claimSavingsReward(){ alert('此功能已停用。储蓄金全部来自抽奖奖金自动积累。'); }


function tierOfName(name){ const p=(state.prizes||[]).find(pp=>pp.name===name); return tierKey(p||{name:name||''}); }
function tierKey(p){
  if(/龙珠/.test(p.name||'')) return 'longzhu';
  const v=p.price;
  if(typeof v!=='number') return null;
  if(v>=0.1&&v<=0.4) return 'a';
  if(v>=0.5&&v<=0.9) return 'b';
  if(v>=1&&v<=1.5) return 'c';
  if(Math.abs(v-2)<1e-9) return 'd';
  if(Math.abs(v-2.5)<1e-9) return 'e';
  if(Math.abs(v-3)<1e-9) return 'f';
  return null;
}
function drawWeighted(){
  if(Math.random() < 0.5) return null;
  const total = TIERS.reduce((s,t)=>s+t.prob,0);
  const r = Math.random()*total; let cum=0;
  for(const t of TIERS){ cum+=t.prob; if(r<cum){ const m=(state.prizes||[]).filter(p=>tierKey(p)===t.key); if(m.length) return m[Math.floor(Math.random()*m.length)]; } }
  return null;
}
function pickEncourage(){
  let m;
  do { m = ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)]; } while(m===lastEncourage && ENCOURAGE.length>1);
  lastEncourage = m; return m;
}
let viewDate = today();

// ---------- 配置:奖励规则表 ----------
const REWARD_ITEMS = [
  {id:'r1', project:'学习', content:'数学超前学', amount:'每天2小节', reward:'每小节抽奖2次', note:'', type:'perDay', lotteryPer:2, max:4},
  {id:'r2', project:'学习', content:'每日讲错题', amount:'计算4 + 应用题2', reward:'抽奖2次', type:'perDay', lotteryPer:2},
  {id:'r3', project:'学习', content:'口算12分钟', amount:'每天1页(12分钟内100道且100%正确)', reward:'抽奖1次', type:'perDay', lotteryPer:1},
  {id:'r4', project:'学习', content:'数学章节通关', amount:'每章完成后通关1次(90分以上)', reward:'通关奖励10次抽奖', type:'perChapter', lotteryPer:10, note:'不通关需讲错题直至通关'},
  {id:'r5', project:'英语', content:'动画片', amount:'每天1小时', reward:'', type:'plain'},
  {id:'r6', project:'英语', content:'磨耳朵', amount:'每天1小时以上', reward:'连续7天达1.5小时 → 奖励14次抽奖', type:'streak', streak:7, lottery:14},

function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){ alert('保存失败:'+e.message); } }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return fmt(d); }

function getComp(date,id){ return (state.completions[date]||{})[id] || {done:false, sign:''}; }
function setDone(date,id,done){
  state.completions[date]=state.completions[date]||{};
  const cur = state.completions[date][id] || {done:false, sign:''};
  state.completions[date][id] = {done, sign:cur.sign};
  save();
  const item = REWARD_ITEMS.find(x=>x.id===id);
  if(item && item.type==='streak') reconcileStreak(id, date);
}
function setSign(date,id,sign){
  state.completions[date]=state.completions[date]||{};
  const cur = state.completions[date][id] || {done:false, sign:''};
  state.completions[date][id] = {done:cur.done, sign};
  save();
}
function getSched(date,id){ return !!((state.schedule[date]||{})[id]); }
function setSched(date,id,v){ state.schedule[date]=state.schedule[date]||{}; state.schedule[date][id]=v; save(); }

function computeStreak(date,id){
  let c=0; let d=parseDate(date);
  while(true){
    const ds=fmt(d);
    if(getComp(ds,id).done){ c++; d.setDate(d.getDate()-1); } else break;
  }
  return c;
}
function reconcileStreak(id, date){
  const item = REWARD_ITEMS.find(x=>x.id===id);
  const streak = computeStreak(date,id);
  const cycles = Math.floor(streak/item.streak);
  const prev = state.streakAwarded[id]||0;
  if(cycles>prev){
    const add=(cycles-prev)*item.lottery;
    addLottery(add, '【'+item.project+'】'+item.content+' 连续'+streak+'天达标 +'+add+'次');
    state.streakAwarded[id]=cycles;
  } else if(streak<item.streak){
    state.streakAwarded[id]=0;
  }
  save();
}
function addLottery(n, reason){
  n=Number(n)||0; if(n===0) return;
  state.lottery.pool += n;
  state.lottery.history.unshift({date:today(), reason, count:n});
  save();
}
function adjustLottery(n){ addLottery(n, (n>0?'手动增加':'手动扣减')+' '+Math.abs(n)+'次'); }
function doDraw(){

  state.lottery.pool -= 1; save();

    ticks++;
    if(ticks>12){

      if(picked){

function playWin(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC();
    const notes=[523.25,659.25,783.99,1046.5];
    notes.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='triangle'; o.frequency.value=f;
      o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+i*0.09;
      g.gain.setValueAtTime(0.001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0008,t+0.25);
      o.start(t); o.stop(t+0.27);
    });
  }catch(e){}
}
function confetti(){
  const colors=['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6'];
  for(let i=0;i<44;i++){
    const p=document.createElement('div');
    p.style.cssText='position:fixed;top:-12px;width:8px;height:13px;z-index:200;pointer-events:none;border-radius:2px;left:'+(Math.random()*100).toFixed(2)+'vw;background:'+colors[i%colors.length]+';';
    document.body.appendChild(p);
    const dur=1100+Math.random()*1300;
    const dx=(Math.random()*220-110).toFixed(0);
    const rot=(Math.random()*720).toFixed(0);
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'px,105vh) rotate('+rot+'deg)',opacity:0.85}],{duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'}).onfinish=()=>p.remove();
  }
}

      if(it.type==='streak' && it.extraPerDay) addBtn='<button class="addbtn" data-add="'+it.id+'" data-extra="1">+'+it.extraPerDay+'次(多学半小时)</button>';

// ---------- 云同步 ----------
var GIST_API = 'https://gitee.com/api/v5/repos';
var GIST_FN = 'dijun_checkin_backup.json';
var CLOUD_KEY = 'dijun_cloud_v1';

function b64encode(str){
  try{ return btoa(unescape(encodeURIComponent(str))); }catch(e){ return btoa(str); }
}
function b64decode(str){
  try{ return decodeURIComponent(escape(atob(str))); }catch(e){ return atob(str); }
}
function giteeFileUrl(cfg){
  return GIST_API+'/'+cfg.owner+'/'+cfg.repo+'/contents/'+GIST_FN;
}

function cloudGetConfig(){
  try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}'); } catch(e){ return {}; }
}

function cloudSaveConfig(cfg){ localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg)); }

function openCloudModal(){
  var modal = document.getElementById('cloudModal');
  if(!modal) return;
  var cfg = cloudGetConfig();
  document.getElementById('cloudToken').value = cfg.token||'';
  var oEl = document.getElementById('cloudOwner');
  var rEl = document.getElementById('cloudRepo');
  if(oEl) oEl.value = cfg.owner||'';
  if(rEl) rEl.value = cfg.repo||'';
  document.getElementById('cloudAutoSync').checked = !!cfg.autoSync;
  var linkEl = document.getElementById('cloudGistLink');
  var statusEl = document.getElementById('cloudStatus');
  if(statusEl) statusEl.style.display = 'none';
  if(linkEl){
    if(cfg.owner && cfg.repo){
      linkEl.innerHTML = '<a href="https://gitee.com/'+cfg.owner+'/'+cfg.repo+'" target="_blank">📎 查看仓库</a>';
      linkEl.style.display = 'block';
    } else {
      linkEl.style.display = 'none';
    }
  }
  modal.classList.remove('hidden');
}

function closeCloudModal(){
  var m = document.getElementById('cloudModal');
  if(m) m.classList.add('hidden');
}

document.getElementById('cloudModal').addEventListener('click', function(e){
  if(e.target && e.target.id === 'cloudModal') closeCloudModal();
});

function cloudSetStatus(msg, type){
  var el = document.getElementById('cloudStatus');
  if(!el) return;
  el.className = 'cloud-status-'+type;
  el.textContent = msg;
  el.style.display = 'block';
}

function cloudBuildPayload(){
  return JSON.stringify({v:2, updatedAt: new Date().toISOString(), state: state}, null, 0);
}

function cloudMergeState(remoteStr){
  try {
    var remote = JSON.parse(remoteStr);
    if(!remote || !remote.state) throw new Error('格式错误');
    var keys = ['completions','schedule','punishments','draws','lottery','savings','streakAwarded','prizes','dailyLimit','totalDraws','parentPIN'];
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      if(remote.state[k] !== undefined){
        state[k] = remote.state[k];
      }
    }
    localStorage.setItem(STORE, JSON.stringify(state));
    migrateState();
  } catch(e) {
    throw new Error('合并失败：'+e.message);
  }
}

function cloudUpload(cb){
  var cfg = cloudGetConfig();
  if(!cfg.token || !cfg.owner || !cfg.repo){ cloudSetStatus('请先填写令牌、用户名、仓库名并保存', 'err'); return; }
  var body = cloudBuildPayload();
  var content = b64encode(body);
  cloudSetStatus('正在上传...', 'info');
  var upBtn = document.getElementById('cloudUpload');
  var fab = document.getElementById('cloudFab');
  if(upBtn) upBtn.disabled = true;
  if(fab) fab.classList.add('syncing');
  fetch(giteeFileUrl(cfg)+'?access_token='+encodeURIComponent(cfg.token), {method:'GET'})
    .then(function(r){ if(r.status===404) return null; return r.json(); })
    .then(function(exist){
      var payload = { access_token: cfg.token, content: content, message: '打卡数据更新 '+new Date().toLocaleString('zh-CN') };
      var method = 'POST';
      if(exist && exist.sha){ method = 'PUT'; payload.sha = exist.sha; }
      return fetch(giteeFileUrl(cfg), { method: method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && data.content){
        cloudSetStatus('✅ 上传成功！'+new Date().toLocaleString('zh-CN'), 'ok');
        var linkEl = document.getElementById('cloudGistLink');
        if(linkEl){
          linkEl.innerHTML = '<a href="https://gitee.com/'+cfg.owner+'/'+cfg.repo+'/blob/master/'+GIST_FN+'" target="_blank">📎 查看文件</a>';
          linkEl.style.display = 'block';
        }
        if(cb) cb(true);
      } else if(data && data.message){
        cloudSetStatus('❌ 上传失败：'+data.message, 'err');
        if(cb) cb(false);
      } else {
        cloudSetStatus('❌ 上传失败', 'err');
        if(cb) cb(false);
      }
    })
    .catch(function(e){
      cloudSetStatus('❌ 错误：'+(e.message||e), 'err');
      console.error('upload err', e);
      if(cb) cb(false);
    })
    .finally(function(){
      if(upBtn) upBtn.disabled = false;
      if(fab) fab.classList.remove('syncing');
    });
}

function cloudDownload(){
  var cfg = cloudGetConfig();
  if(!cfg.token || !cfg.owner || !cfg.repo){ cloudSetStatus('请先填写令牌、用户名、仓库名并保存', 'err'); return; }
  cloudSetStatus('正在下载...', 'info');
  var dlBtn = document.getElementById('cloudDownload');
  var fab = document.getElementById('cloudFab');
  if(dlBtn) dlBtn.disabled = true;
  if(fab) fab.classList.add('syncing');
  fetch(giteeFileUrl(cfg)+'?access_token='+encodeURIComponent(cfg.token), {method:'GET'})
    .then(function(r){
      if(r.status===404){ cloudSetStatus('云端还没有数据，请先上传一次', 'err'); return null; }
      return r.json();
    })
    .then(function(data){
      if(data && data.content){
        cloudMergeState(b64decode(data.content));
        cloudSetStatus('✅ 下载成功！'+new Date().toLocaleString('zh-CN'), 'ok');
        renderAll();
      } else if(data && data.message){
        cloudSetStatus('❌ 下载失败：'+data.message, 'err');
      }
    })
    .catch(function(e){
      cloudSetStatus('❌ 错误：'+(e.message||e), 'err');
    })
    .finally(function(){
      if(dlBtn) dlBtn.disabled = false;
      if(fab) fab.classList.remove('syncing');
    });
}

var _origShowTab = showTab;
showTab = function(name){
  _origShowTab.apply(this, arguments);
  if(name==='cloud') openCloudModal();
};

// Auto-sync on app open: check if autoSync is on and sync from cloud
function cloudAutoOnOpen(){
  var cfg = cloudGetConfig();
  if(cfg.token && cfg.owner && cfg.repo && cfg.autoSync){
    cloudDownloadSilent();
  }
}

function cloudDownloadSilent(){
  var cfg = cloudGetConfig();
  if(!cfg.token || !cfg.owner || !cfg.repo) return;
  if(window._cloudSyncing) return;
  window._cloudSyncing = true;
  fetch(giteeFileUrl(cfg)+'?access_token='+encodeURIComponent(cfg.token), {method:'GET'})
    .then(function(r){ if(r.status===404) return null; return r.json(); })
    .then(function(data){
      if(data && data.content){
        cloudMergeState(b64decode(data.content));
        renderAll();
      }
    })
    .catch(function(){})
    .finally(function(){ window._cloudSyncing = false; });
}

// Call auto-sync when page loads
window.addEventListener('load', function(){
  setTimeout(cloudAutoOnOpen, 1500); // delay 1.5s to let page render first
});

// Auto-sync hook: wrap save()
function exportJSON(){
  var data = JSON.stringify(state, null, 0);
  var blob = new Blob([data], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'dijun-backup-'+ts+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  cloudSetStatus('✅ 已导出 dijun-backup-'+ts+'.json', 'ok');
}

function importJSON(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f){ return; }
  if(!confirm('导入会覆盖本地数据，确定继续？\\n（建议先导出当前数据做备份）')){
    ev.target.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var obj = JSON.parse(e.target.result);
      var keys = ['completions','schedule','punishments','draws','lottery','savings','streakAwarded','prizes','dailyLimit','totalDraws','parentPIN'];
      for(var i=0;i<keys.length;i++){
        var k = keys[i];
        if(obj[k] !== undefined){ state[k] = obj[k]; }
      }
      localStorage.setItem(STORE, JSON.stringify(state));
      migrateState();
      renderAll();
      cloudSetStatus('✅ 导入成功！', 'ok');
    }catch(err){
      cloudSetStatus('❌ 导入失败：'+err.message, 'err');
    }
    ev.target.value = '';
  };
  reader.readAsText(f, 'utf-8');
}

var _origSave = save;
save = function(){
  _origSave.apply(this, arguments);
  var cfg = cloudGetConfig();
  if(cfg.token && cfg.autoSync && cfg.gistId){
    if(window._cloudSyncing) return;
    window._cloudSyncing = true;
    var self = this;
    setTimeout(function(){
      cloudUpload(function(ok){
        window._cloudSyncing = false;
      });
    }, 2500);
  }
};


</script>


<button class="cloud-fab" id="cloudFab" title="云同步" onclick="openCloudModal()">☁️</button>

<div id="cloudModal" class="modal hidden">
  <div class="modal-card">
    <div class="cloud-title">☁️ 云同步设置</div>
    <div class="cloud-sub">数据存储在 Gitee 私有仓库（国内直连）</div>
    <div class="cloud-row">
      <div class="cloud-lbl">🔑 Gitee 私人令牌</div>
      <input type="password" id="cloudToken" class="cloud-input" placeholder="私人令牌（需勾选 projects 权限）">
    </div>
    <div class="cloud-row">
      <div class="cloud-lbl">👤 Gitee 用户名</div>
      <input type="text" id="cloudOwner" class="cloud-input" placeholder="你的 Gitee 用户名">
    </div>
    <div class="cloud-row">
      <div class="cloud-lbl">📦 仓库名</div>
      <input type="text" id="cloudRepo" class="cloud-input" placeholder="私有仓库名（需先创建）">
    </div>
    <div class="cloud-row-toggle">
      <span>⚡ 自动同步</span>
      <label class="cloud-toggle"><input type="checkbox" id="cloudAutoSync"><span class="cloud-toggle-slider"></span></label>
    </div>
    <div id="cloudStatus"></div>
    <div class="cloud-btns">
      <button class="cloud-btn-upload" id="cloudUpload" onclick="cloudUpload();">⬆ 上传本地</button>
      <button class="cloud-btn-dl" id="cloudDownload" onclick="cloudDownload();">⬇ 下载云端</button>
    </div>
    <div class="cloud-btns" style="margin-top:6px">
      <button class="cloud-btn-save" id="cloudSave" onclick="var t=document.getElementById('cloudToken').value,o=document.getElementById('cloudOwner').value,r=document.getElementById('cloudRepo').value,a=document.getElementById('cloudAutoSync').checked;if(!t||!o||!r){cloudSetStatus('请填写令牌、用户名、仓库名','err');return;}cloudSaveConfig({token:t,owner:o,repo:r,autoSync:a});cloudSetStatus('✅ 设置已保存！','ok');">💾 保存</button>
      <button class="cloud-btn-clear" id="cloudClear" onclick="if(confirm('确定清除云同步设置？')){localStorage.removeItem('dijun_cloud_v1');document.getElementById('cloudToken').value='';document.getElementById('cloudOwner').value='';document.getElementById('cloudRepo').value='';document.getElementById('cloudAutoSync').checked=false;cloudSetStatus('设置已清除','info');}">🗑 清除</button>
    </div>
    <div class="cloud-btns" style="margin-top:6px">
      <button class="cloud-btn-save" onclick="exportJSON();">📤 导出 JSON</button>
      <label class="cloud-btn-dl" style="display:inline-block;text-align:center;padding:10px 14px;border-radius:8px;cursor:pointer;background:#f0f4ff;color:#5b6cdb;font-size:14px;">
        📥 导入 JSON
        <input type="file" id="jsonImportInput" accept=".json" style="display:none" onchange="importJSON(event);">
      </label>
    </div>
    <div class="cloud-gist-link" id="cloudGistLink" style="display:none"></div>
  </div>
</div>


</body>
</html>
